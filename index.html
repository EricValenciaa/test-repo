<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta username="viewport" content="widht=device-widht, initial-scale:1.0" />
    <title>Halaman Login</title>
  </head>
  <body>
    <h1>Login</h1>

    <form action="/login" method="post">
      <label for="username">username</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Masukkan Username"
        required
      />

      <br /><br />

      <label for="password">password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Masukkan Password"
        required
      />

      <br /><br />

      <button type="submit">Login</button>
    </form>
  </body>
</html>
